<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Used by the browser's engines only when /etc/fonts/fonts.conf does not
     exist, which is the case on a Palmframe image today: palmy reads fonts
     without fontconfig. The families are the fonts package's (Geist,
     JetBrainsMono Nerd Font, DejaVu Sans), and the web's usual names map onto
     them; without these aliases a page asking for Arial or Times gets
     whichever file fontconfig happened to read first. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias binding="same"><family>sans-serif</family><prefer><family>Geist</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Geist</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><accept><family>Geist</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Geist</family></accept></alias>
  <alias binding="same"><family>Liberation Sans</family><accept><family>Geist</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Times</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>JetBrainsMono Nerd Font</family></accept></alias>
  <alias binding="same"><family>Courier</family><accept><family>JetBrainsMono Nerd Font</family></accept></alias>
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>
</fontconfig>
