# demo.conf — the scripted demo recorder's configuration (record.sh).
#
# The host compositor eats SUPER while this one runs nested, and the recorder
# can only synthesize unmodified keys, so every action the demo needs has a
# bare function-key twin here, on top of the default table.
default_binds = keep
debug_hud     = on

bind = ANY, F1,  spawn counter
bind = ANY, F2,  spawn gallery
bind = ANY, F3,  spawn todo
bind = ANY, F4,  spawn term
bind = ANY, F5,  spawn pixels
bind = ANY, F6,  switcher
bind = ANY, F7,  overview
bind = ANY, F8,  close
bind = ANY, F9,  toggletiling
bind = ANY, F10, windowmode
bind = ANY, F11, togglemaximize
bind = ANY, F12, nextlayout
bind = ANY, F13, workspacerel +1
bind = ANY, F14, workspacerel -1
