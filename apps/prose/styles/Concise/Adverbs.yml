extends: existence
message: "Adverb: '%s'. A stronger verb would not need it."
description: |
  An -ly adverb propped against a weak verb is usually one word doing the job
  of a better one: "walked slowly" against "ambled", "said loudly" against
  "shouted". Not every adverb is removable, but a page with twenty of them is
  a page of weak verbs.
level: warning
ignorecase: true
tokens:
  - \b\w{4,}ly\b
exceptions:
  - only
  - early
  - family
  - supply
  - apply
  - reply
  - imply
  - multiply
  - rely
  - likely
  - ugly
  - holy
  - italy
  - july
