extends: repetition
message: "'%s' twice in a row."
description: |
  A doubled word is invisible to its author and obvious to everyone else.
level: error
ignorecase: true
alpha: true
tokens:
  # Two letters at least. `\w+` is what Vale's own examples use, and it
  # flags the "R. R" of "J. R. R. Tolkien" — correct by the rule and wrong
  # as advice, so the shipped packs ask for a word rather than a letter.
  - '\b(\w{2,})\b'
