# /etc/doas.conf — who may run what as whom, through doas.
#
# One rule per line; the last rule that matches decides, and nothing
# matching means no. The grammar is OpenBSD's doas.conf(5):
#
#   permit|deny [options] identity [as target] [cmd command [args ...]]
#
#   options:  nopass  nolog  persist  keepenv  setenv { VAR=value -VAR VAR }
#   identity: a user name, or :group
#
# doas refuses to run at all if this file is not root's, if anyone else may
# write it, or if any line of it is wrong. Check a change before saving:
#   doas -C /path/to/new.conf [command]
#
# Members of wheel may run anything as anyone, after their own password:
permit :wheel

# Ask once per terminal every 5 minutes instead (replace the line above):
#permit persist :wheel

# Let palm refresh the package lists without a password:
#permit nopass palm cmd palm args update
