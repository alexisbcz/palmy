# The system language: palm-init exports it to services and palm-login to
# the login screen and to every session (distro/notes/i18n.md). The installer
# rewrites this file with the language picked on its first page, e.g.
# LANG=fr_FR.UTF-8. LANGUAGE=fr:en may be added for a fallback list.
LANG=en_US.UTF-8
