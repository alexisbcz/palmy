# Palmframe has no service manager for user sessions, so the PipeWire daemon
# starts its companions itself: WirePlumber (the session manager: devices,
# default sink, volumes) and a second pipewire as the PulseAudio server, for
# pactl. All three end when the session's pipewire does.
context.exec = [
    { path = "/usr/bin/wireplumber" args = "" }
    { path = "/usr/bin/pipewire" args = "-c pipewire-pulse.conf" }
]
